        <div class="filter-group" style="margin-bottom: 20px;">

        </div>
        
        <div class="filter-group" style="margin-bottom: 30px;">
            <label>Palavra-passe</label>
            <input type="password" id="password" placeholder="••••••••" class="login-input">

        // Helper para fetch com timeout
        async function fetchComTimeout(url, options, timeoutMs = 15000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        async function fazerLogin() {
            const user = document.getElementById('username').value.toLowerCase().trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('login-error');
            const btnLogin = document.querySelector('.btn-export-full');

            if (!user || !pass) {
                errorMsg.innerText = "Por favor, preencha o utilizador e a palavra-passe.";
                errorMsg.style.display = 'block';
                return;
            }

            // Feedback visual de carregamento
            btnLogin.innerText = "A validar credenciais...";
            btnLogin.disabled = true;
            btnLogin.style.opacity = '0.7';
            errorMsg.style.display = 'none';

            // 1. Autenticação primária via API backend (com auditoria e emissão de token)
            try {
                const apiRes = await fetchComTimeout('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                }, 8000);

                const apiData = await apiRes.json();

                if (apiRes.ok && apiData.status === 'success') {
                    // Garante que nomePlanilha esteja devidamente associado
                    if ((!apiData.user.nomePlanilha || apiData.user.nomePlanilha === apiData.user.nomeCompleto) && USUARIOS_CORINO[user]?.nomePlanilha) {
                        apiData.user.nomePlanilha = USUARIOS_CORINO[user].nomePlanilha;
                    }
                    // Armazena token de autorização e perfil do usuário
                    sessionStorage.setItem('corino_auth_token', apiData.token);
                    sessionStorage.setItem('corino_user', JSON.stringify(apiData.user));
                    localStorage.setItem('corino_auth_token', apiData.token);
                    window.location.href = 'index.html';
                    return;
                } else if (apiRes.status === 401 || apiRes.status === 403) {
                    errorMsg.innerText = apiData.message || "Utilizador ou palavra-passe incorretos.";
                    errorMsg.style.display = 'block';
                    restaurarBotaoLogin(btnLogin);
                    return;
                }
            } catch (errApi) {
                console.warn('⚠️ [Auth API] Backend indisponível ou offline. Executando fallback local...', errApi);
            }

            // 2. Fallback local para compatibilidade caso o backend não esteja respondendo
            if (USUARIOS_CORINO[user] && USUARIOS_CORINO[user].senha === pass) {
                const uInfo = USUARIOS_CORINO[user];
                const dadosUsuario = {
                    username: user,
                    perfil: uInfo.perfil,
                    nomePlanilha: uInfo.nomePlanilha,
                    setor: uInfo.setor,
                    role: (uInfo.perfil === 'administrativo' || user === 'diflor') ? 'admin' : uInfo.perfil
                };
                sessionStorage.setItem('corino_user', JSON.stringify(dadosUsuario));
                window.location.href = 'index.html';
                return;
            }

            // 3. Fallback remoto com a API do Google Apps Script
            try {
                const resposta = await fetchComTimeout(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        acao: "login", 
                        username: user, 
                        password: pass 
                    })
                }, 15000);

                const resultado = await resposta.json();

                if (resultado.status === 'success') {
                    const dadosUsuario = {
                        username: user,
                        perfil: resultado.perfil,
                        nomePlanilha: resultado.nomePlanilha,
                        setor: resultado.setor,
                        role: (resultado.perfil === 'administrativo' || user === 'diflor') ? 'admin' : resultado.perfil
                    };
                    sessionStorage.setItem('corino_user', JSON.stringify(dadosUsuario));
                    window.location.href = 'index.html'; 
                } else {
                    errorMsg.innerText = resultado.message || "Utilizador ou palavra-passe incorretos.";
                    errorMsg.style.display = 'block';
                    restaurarBotaoLogin(btnLogin);
                }
            } catch (erro) {
                console.error("Erro no login:", erro);
                if (erro.name === 'AbortError') {
                    errorMsg.innerText = "Tempo limite excedido ao comunicar com o servidor. Por favor, tente novamente.";
                } else {
                    errorMsg.innerText = "Utilizador ou palavra-passe incorretos.";
                }
                errorMsg.style.display = 'block';
                restaurarBotaoLogin(btnLogin);
            }
        }

        function restaurarBotaoLogin(btn) {
            btn.innerText = "Entrar no Sistema";
            btn.disabled = false;
            btn.style.opacity = '1';
        }

        // Adiciona os event listeners após o DOM ser carregado
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('username').addEventListener('keypress', (event) => { if (event.key === "Enter") fazerLogin(); });
            document.getElementById('password').addEventListener('keypress', (event) => { if (event.key === "Enter") fazerLogin(); });
            document.getElementById('btnLogin').addEventListener('click', fazerLogin);
            
            // Exibe mensagem caso tenha sido deslogado por inatividade
            const reason = sessionStorage.getItem('corino_logout_reason');
            if (reason === 'inactivity') {
                const infoMsg = document.getElementById('login-info-msg');
                if (infoMsg) infoMsg.style.display = 'block';
                sessionStorage.removeItem('corino_logout_reason');
            }
        });
    </script>
